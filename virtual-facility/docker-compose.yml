services:
  # =================================================
  # External Services
  # =================================================

  # NATS Server
  nats-server:
    image: nats:latest

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.1-management

  # =================================================
  # Microservices
  # =================================================

  # Workflows
  workflows-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=workflows-service
    command: npm run start:dev -- workflows-service
    environment:
      - PORT=3001
      - POSTGRES_HOST=${DB_HOST_WF}
      - POSTGRES_PORT=${DB_PORT_WF}
      - POSTGRES_USER=${DB_USERNAME_WF}
      - POSTGRES_PASSWORD=${DB_PASSWORD_WF}
      - POSTGRES_DB=${DB_NAME_WF}
      - NODE_ENV=development
      - RABBITMQ_URL=${RABBITMQ_URL}
    deploy:
      replicas: 3
    volumes:
      - ./libs:/usr/src/app/libs
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./apps/workflows-service:/usr/src/app/apps/workflows-service
    depends_on:
      - workflows-db
      - nats-server
      - rabbitmq
    restart: unless-stopped

  # ========================================================================================

  # Virtual Facility
  virtual-facility:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=virtual-facility
    command: npm run start:dev -- virtual-facility
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - NODE_ENV=development
      - POSTGRES_HOST=${DB_HOST_VF}
      - POSTGRES_PORT=${DB_PORT_VF}
      - POSTGRES_USER=${DB_USERNAME_VF}
      - POSTGRES_PASSWORD=${DB_PASSWORD_VF}
      - POSTGRES_DB=${DB_NAME_VF}
      - RABBITMQ_URL=${RABBITMQ_URL}
    volumes:
      - ./libs:/usr/src/app/libs
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./apps/virtual-facility:/usr/src/app/apps/virtual-facility
    depends_on:
      - virtual-facility-db
      - workflows-service
      - nats-server
      - rabbitmq
    restart: unless-stopped

  # ========================================================================================

  # Alarm
  alarms-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=alarms-service
    command: npm run start:dev -- alarms-service
    environment:
      - PORT=3002
      - NODE_ENV=development
      - NATS_URL=${NATS_SERVER_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    volumes:
      - ./libs:/usr/src/app/libs
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./apps/alarms-service:/usr/src/app/apps/alarms-service
    depends_on:
      - nats-server
      - rabbitmq
    restart: unless-stopped

  # ========================================================================================
  
  # Alarm Generator
  alarms-generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=alarms-generator
    command: npm run start:dev -- alarms-generator
    environment:
      - PORT=3003
      - NODE_ENV=development
      - NATS_URL=${NATS_SERVER_URL}
    volumes:
      - ./libs:/usr/src/app/libs
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./apps/alarms-generator:/usr/src/app/apps/alarms-generator
    depends_on:
      - nats-server
    restart: unless-stopped

  # ========================================================================================

  # Alarms Classifier
  alarms-classifier-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=alarms-classifier-service
    command: npm run start:dev -- alarms-classifier-service
    environment:
      - PORT=3005
      - NODE_ENV=development
      - NATS_URL=${NATS_SERVER_URL}
    volumes:
      - ./libs:/usr/src/app/libs
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./apps/alarms-classifier-service:/usr/src/app/apps/alarms-classifier-service
    depends_on:
      - nats-server
    restart: unless-stopped

  # ========================================================================================

    # Notification Service
  notifications-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_NAME=notifications-service
    command: npm run start:dev -- notifications-service
    environment:
      - PORT=3004
      - NODE_ENV=development
      - RABBITMQ_URL=${RABBITMQ_URL}
    deploy:
      replicas: 3
    volumes:
      - ./libs:/usr/src/app/libs
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./apps/notifications-service:/usr/src/app/apps/notifications-service
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # =================================================
  # Database
  # =================================================

  # Workflows Database
  workflows-db:
    image: postgres:17
    container_name: workflows_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME_WF}
      POSTGRES_PASSWORD: ${DB_PASSWORD_WF}
      POSTGRES_DB: ${DB_NAME_WF}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME_WF}']
      interval: 10s
      timeout: 5s
      retries: 5

    # Virtual Facility Database
  virtual-facility-db:
    image: postgres:17
    container_name: virtual_facility_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME_VF}
      POSTGRES_PASSWORD: ${DB_PASSWORD_VF}
      POSTGRES_DB: ${DB_NAME_VF}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME_VF}']
      interval: 10s
      timeout: 5s
      retries: 5
