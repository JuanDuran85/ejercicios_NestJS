services:

  # NATS Server
  nats-server:
    image: nats:latest
    ports:
      - 8222:8222

# =================================================
# Client Gateway Connections
# =================================================

  # Client Gateway
  client-gateway:
    container_name: client_gateway
    build: ./client-gateway
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${CLIENT_GATEWAY_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
    restart: always

# =================================================
# Microservices
# =================================================

  # Products MicroService
  products-app:
    container_name: products_ms
    build: ./products-ms
    ports:
      - ${PRODUCTS_APP_PORT}:3001
    volumes:
      - ./products-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${PRODUCTS_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=file:./dev.db
    restart: always

  # Order MicroService
  orders-app:
    container_name: orders_ms
    build: ./orders-ms
    ports:
      - ${ORDERS_APP_PORT}:3002
    volumes:
      - ./orders-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${ORDERS_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@orders-db:5432/${DB_NAME}?schema=public
    restart: always
    depends_on:
      orders-db:
        condition: service_healthy
        restart: true

  # Payments MicroService
  payments-app:
    container_name: payments_ms
    build: ./payments-ms
    ports:
      - ${PAYMENTS_APP_PORT}:3003
    volumes:
      - ./payments-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${PAYMENTS_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
    restart: always

  # Auth Microservice
  auth-app:
    container_name: auth_ms
    build: ./auth-ms
    ports:
      - ${AUTH_APP_PORT}:3004
    volumes:
      - ./auth-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=${AUTH_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=${DATABASE_MONGO_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

# =================================================
# Database configuration
# =================================================

    # Orders database
  orders-db:
    image: postgres:17
    container_name: orders_database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME} 
    volumes:
      - ./orders-ms/postgres-db:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s