services:

  # NATS Server
  nats-server:
    image: nats:latest

# =================================================
# Client Gateway Connections
# =================================================

  # Client Gateway
  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: Dockerfile.prod
    ports:
      - ${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}
    image: southamerica-west1-docker.pkg.dev/store-microservice-497220/image-registry/client-gateway-prod
    environment:
      - PORT=${CLIENT_GATEWAY_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
    restart: always

# =================================================
# Microservices
# =================================================

  # Products MicroService
  products-app:
    build: 
      context: ./products-ms
      dockerfile: Dockerfile.prod
    image: southamerica-west1-docker.pkg.dev/store-microservice-497220/image-registry/products-ms-prod
    ports:
      - ${PRODUCTS_APP_PORT}:${PRODUCTS_APP_PORT}
    environment:
      - PORT=${PRODUCTS_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=file:./dev.db
    restart: always

  # Order MicroService
  orders-app:
    build: 
      context: ./orders-ms
      dockerfile: Dockerfile.prod
      args:
        - ORDERS_DATABASE_URL=${ORDERS_DATABASE_URL}
    image: southamerica-west1-docker.pkg.dev/store-microservice-497220/image-registry/orders-ms-prod
    ports:
      - ${ORDERS_APP_PORT}:${ORDERS_APP_PORT}
    environment:
      - PORT=${ORDERS_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=${ORDERS_DATABASE_URL}
    restart: always

  # Payments MicroService
  payments-app:
    build: 
      context: ./payments-ms
      dockerfile: Dockerfile.prod
    image: southamerica-west1-docker.pkg.dev/store-microservice-497220/image-registry/payments-ms-prod
    ports:
      - ${PAYMENTS_APP_PORT}:${PAYMENTS_APP_PORT}
    environment:
      - PORT=${PAYMENTS_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
    restart: always

  # Auth Microservice
  auth-app:
    build: 
      context: ./auth-ms
      dockerfile: Dockerfile.prod
    image: southamerica-west1-docker.pkg.dev/store-microservice-497220/image-registry/auth-ms-prod
    ports:
      - ${AUTH_APP_PORT}:${AUTH_APP_PORT}
    environment:
      - PORT=${AUTH_APP_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=${DATABASE_MONGO_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: always